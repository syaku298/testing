<h1>🌟 Rekod Pelaksanaan Pembentukan Karakter</h1>

  <label>Tempoh <select id="fTempoh"><option value="">Semua</option><option value="hari">Harian</option><option value="minggu">Mingguan</option><option value="bulan">Bulanan</option></select></label>
  <span id="fHari" hidden><input type="date" id="fTarikh"> <small id="fHint"></small></span>
  <span id="fBulan" hidden><select id="fBln"></select> <select id="fThn"></select></span>
  <span class="cnt" id="fCount"></span>
</div>

<div class="wrap rk">
<table class="mt1">
<colgroup><col style="width:44px"><col style="width:112px"><col style="width:90px"><col style="width:200px"><col style="width:110px"><col style="width:95px"><col style="width:150px"><col><col style="width:44px"></colgroup>
<thead><tr>
<th>Bil.</th><th>Tarikh</th><th>Masa</th><th>Guru</th><th>Mata Pelajaran</th><th>Kelas</th>

</tr></thead>

<script>
var KELAS=["1 Alba","1 Bonia","1 Casio","1 Diesel","1 Emporio","1 Fossil","1 Garmin","1 Hublot","1 Longines","1 Montblanc","1 Orient","1 Polo","1 Quartz","1 Rolex","1 Seiko","1 Tissot"];
var ELEMEN=["Penyayang","Berdaya Tahan","Berupaya Memimpin","Warganegara Aktif"];
var WARNA={"Penyayang":"var(--c1)","Berdaya Tahan":"var(--c2)","Berupaya Memimpin":"var(--c3)","Warganegara Aktif":"var(--c4)"};
var KEY="rekod-pk-2027", data={rows:[],guru:"",kelas:""};
try{var s=localStorage.getItem(KEY);if(s)data=JSON.parse(s)}catch(e){}
if(!data||!data.rows)data={rows:[],guru:"",kelas:""};
data.rows.forEach(function(r){r.masa=fmtT(r.masa)});
if(data.kl&&data.kl.length)KELAS=data.kl.slice();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function p(n){return String(n).padStart(2,"0")}
function today(){var d=new Date();return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function fmtT(s){s=String(s||"").trim();if(!s)return"";var m=s.match(/^(\d{1,2})[:.]?(\d{2})?\s*([ap])?\.?m*\.?$/i);if(!m)return s;
 var h=+m[1],mi=m[2]||"00",ap=m[3]?m[3].toUpperCase():(h>=12&&h<24?"P":"A");
 if(+mi>59||h>24)return s;return p(h%12||12)+":"+mi+" "+ap+"M"}
function now(){var d=new Date();return fmtT(p(d.getHours())+":"+p(d.getMinutes()))}
function msg(t){document.getElementById("msg").textContent=t}
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}

function render(){
  var tb=document.getElementById("rows");
  var idx=[];data.rows.forEach(function(r,j){if(inView(r))idx.push(j)});
  tb.innerHTML=idx.map(function(i,n){var r=data.rows[i];
    var opts='<option value="">— Pilih —</option>'+ELEMEN.map(function(e){return '<option'+(r.elemen===e?' selected':'')+'>'+e+'</option>'}).join("");
    return '<tr data-i="'+i+'"><td class="n">'+(n+1)+'</td>'+
    '<td><input type="date" data-f="tarikh" value="'+esc(r.tarikh)+'"></td>'+
    '<td><input type="text" data-f="masa" value="'+esc(r.masa)+'" placeholder="hh:mm AM" autocomplete="off"></td>'+
    '<td><input type="text" data-f="guru" autocomplete="off" placeholder="Taip nama guru" value="'+esc(r.guru)+'"></td>'+
    '<td><input type="text" data-f="matapelajaran" value="'+esc(r.matapelajaran)+'" placeholder="cth. Bahasa Melayu"></td>'+
    '<td><select data-f="kelas"><option value="">— Pilih —</option>'+(r.kelas&&KELAS.indexOf(r.kelas)<0?KELAS.concat([r.kelas]):KELAS).map(function(k){return '<option'+(r.kelas===k?' selected':'')+'>'+k+'</option>'}).join("")+'</select></td>'+
    '<td style="background:'+(WARNA[r.elemen]||"transparent")+'"><select data-f="elemen">'+opts+'</select></td>'+
    '<td><textarea rows="2" data-f="catatan" placeholder="Aktiviti yang dilaksanakan">'+esc(r.catatan)+'</textarea></td>'+
    '<td><button class="del" data-del="'+i+'" title="Padam" aria-label="Padam rekod">✕</button></td></tr>';
  }).join("");
  var em=document.getElementById("empty");em.style.display=idx.length?"none":"block";
  em.textContent=data.rows.length?(vw.mode==="semua"?"Tiada rekod.":"Tiada rekod untuk paparan ini. Tekan “Tambah Rekod” untuk mula. Rekod hari lain tersimpan — pilih “Semua rekod” atau “Pilih tarikh” untuk melihatnya."):"Belum ada rekod. Tekan “Tambah Rekod” — tarikh dan masa diisi secara automatik.";
  refreshFilter();
  var c={};idx.forEach(function(j){var r=data.rows[j];if(r.elemen)c[r.elemen]=(c[r.elemen]||0)+1});
  document.getElementById("stats").innerHTML='<span class="chip" style="background:var(--head)">Jumlah: '+idx.length+'</span>'+
    ELEMEN.map(function(e){return '<span class="chip" style="background:'+WARNA[e]+'">'+e+': '+(c[e]||0)+'</span>'}).join("");
}

document.getElementById("add").onclick=function(){
  data.rows.push({tarikh:today(),masa:now(),guru:data.guru||"",matapelajaran:"",kelas:data.kelas||"",elemen:"",catatan:""});
  save();if($("vMode").value!=="hari"){$("vMode").value="hari";vwUpdate()}else render();msg("Rekod ditambah — tarikh & masa diisi automatik.");
  var t=document.getElementById("rows").lastElementChild;if(t){var f=t.querySelector('[data-f="matapelajaran"]');if(f)f.focus()}
};
var tbody=document.getElementById("rows");
tbody.addEventListener("input",function(e){
  var tr=e.target.closest("tr");if(!tr||!e.target.dataset.f)return;
  data.rows[+tr.dataset.i][e.target.dataset.f]=e.target.value;save();
});
tbody.addEventListener("change",function(e){if(e.target.dataset.f==="elemen")render();
 if(e.target.dataset.f==="tarikh"){var rr=data.rows[+e.target.closest("tr").dataset.i];if(rr&&!inView(rr)){render();msg("Rekod dipindahkan ke tarikh "+fd(rr.tarikh)+" dan tidak lagi dipaparkan di sini.")}}
 if(e.target.dataset.f==="masa"){var v=fmtT(e.target.value);e.target.value=v;data.rows[+e.target.closest("tr").dataset.i].masa=v;save()}});
tbody.addEventListener("click",function(e){
  var b=e.target.closest("[data-del]");if(!b)return;
  if(confirm("Padam rekod ini?")){data.rows.splice(+b.dataset.del,1);save();render()}
});
document.getElementById("clear").onclick=function(){
  if(data.rows.length&&confirm("Kosongkan semua rekod?")){data.rows=[];save();render()}
};

var HEAD=["Bil.","Tarikh","Masa","Guru","Mata Pelajaran","Kelas","Elemen Teras Karakter","Aktiviti / Catatan"];
function matrix(){return getRows().map(function(r,i){return [i+1,r.tarikh,r.masa,r.guru,r.matapelajaran,r.kelas,r.elemen,r.catatan]})}
function toCSV(){
  var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
  return "\uFEFF"+[HEAD].concat(matrix()).map(function(r){return r.map(q).join(",")}).join("\r\n");
}
async function offer(name,payload){
  try{
    var dl=await claude.use("downloads");
    if(!dl){msg("Muat turun tidak tersedia dalam paparan ini.");return}
    await dl.save({filename:name,data:payload});msg("Fail disimpan: "+name);
  }catch(err){msg(err&&err.code==="declined"?"Muat turun dibatalkan.":"Gagal memuat turun ("+((err&&err.code)||"ralat")+").")}
}
document.getElementById("csv").onclick=function(){
  if(!getRows().length){msg("Tiada rekod sepadan dengan pilihan muat turun.");return}
  offer("rekod-pembentukan-karakter-2027.csv",toCSV());
};
document.getElementById("xlsx").onclick=function(){
  if(!getRows().length){msg("Tiada rekod sepadan dengan pilihan muat turun.");return}
  if(!window.XLSX){msg("Pustaka Excel tidak dapat dimuatkan; sila guna CSV (boleh dibuka dalam Excel).");return}
  var ws=XLSX.utils.aoa_to_sheet([HEAD].concat(matrix()));
  ws["!cols"]=[{wch:6},{wch:12},{wch:8},{wch:22},{wch:20},{wch:12},{wch:24},{wch:40}];
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Rekod PK Tahun 1");
  offer("rekod-pembentukan-karakter-2027.xlsx",XLSX.write(wb,{type:"array",bookType:"xlsx"}));
};

function norm(s){return s.toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
if(data.gl&&data.gl.length)NAMA=data.gl.slice();
var NN=NAMA.map(function(n){return norm(n).split(" ")});
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=1;j<=n;j++)d[0][j]=j;
 for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function tokScore(t,ws){var best=0;ws.forEach(function(w,k){var s=0;
 if(w.indexOf(t)===0)s=100;else if(t.length>=3&&w.indexOf(t)>0)s=60;
 else if(t.length>=3){var d=Math.min(lev(t,w.slice(0,t.length)),lev(t,w));if(d<=1)s=50;else if(d<=2&&t.length>=6)s=32}
 if(s&&k<2)s+=6;if(s>best)best=s});return best}
function cari(q){var qt=norm(q).split(" ").filter(Boolean);if(!qt.length)return NAMA.map(function(n,i){return{n:n}});
 var full=norm(q),out=[];
 NAMA.forEach(function(n,i){var tot=0,miss=0;qt.forEach(function(t){var s=tokScore(t,NN[i]);if(s)tot+=s;else miss++});
 if(!tot)return;tot-=miss*40;if(norm(n).indexOf(full)===0)tot+=60;else if(norm(n).indexOf(full)>0)tot+=20;
 if(tot>0)out.push({n:n,s:tot})});
 out.sort(function(a,b){return b.s-a.s||a.n.localeCompare(b.n)});return out.slice(0,8)}
